name: BurnBar
options:
  bundleIdPrefix: com.whoburnedmore
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    GENERATE_INFOPLIST_FILE: "YES"

targets:
  BurnBarCore:
    type: framework
    platform: macOS
    sources: [Sources/BurnBarCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whoburnedmore.burnbar.core
        BUILD_LIBRARY_FOR_DISTRIBUTION: "NO"

  BurnBar:
    type: application
    platform: macOS
    sources: [Sources/BurnBar]
    dependencies:
      - target: BurnBarCore
        embed: true
    info:
      path: Info.plist
      properties:
        CFBundleIdentifier: com.whoburnedmore.burnbar
        CFBundleName: BurnBar
        CFBundleDisplayName: BurnBar
        CFBundleShortVersionString: "0.7.1"
        CFBundleVersion: "1"
        CFBundleIconFile: "AppIcon"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 whoburnedmore"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whoburnedmore.burnbar
        ENABLE_HARDENED_RUNTIME: "YES"
        # With GENERATE_INFOPLIST_FILE=YES, the version keys come from these build
        # settings — not the info.properties above — so they MUST be set or the
        # bundle ships with no CFBundleShortVersionString (which also blocks
        # notarization).
        MARKETING_VERSION: "0.7.1"
        CURRENT_PROJECT_VERSION: "1"

  BurnBarCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/BurnBarCoreTests]
    dependencies:
      - target: BurnBarCore

schemes:
  BurnBar:
    build:
      targets:
        BurnBar: all
    run:
      config: Release
  BurnBarCoreTests:
    build:
      targets:
        BurnBarCoreTests: all
    test:
      config: Debug
      targets: [BurnBarCoreTests]
