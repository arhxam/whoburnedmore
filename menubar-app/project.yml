name: BurnBar
options:
  bundleIdPrefix: com.whoburnedmore
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.2

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    GENERATE_INFOPLIST_FILE: "YES"

targets:
  BurnBarCore:
    type: framework
    platform: macOS
    sources: [Sources/BurnBarCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whoburnedmore.burnbar.core
        BUILD_LIBRARY_FOR_DISTRIBUTION: "NO"

  BurnBar:
    type: application
    platform: macOS
    sources:
      - path: Sources/BurnBar
      - path: ../web/src/app/apple-icon.png
        buildPhase: resources
    dependencies:
      - target: BurnBarCore
        embed: true
      - package: Sparkle
    info:
      path: Info.plist
      properties:
        CFBundleIdentifier: com.whoburnedmore.burnbar
        CFBundleName: whoburnedmore
        CFBundleDisplayName: whoburnedmore
        CFBundleShortVersionString: "0.8.2"
        CFBundleVersion: "8002"
        CFBundleIconFile: "AppIcon"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 whoburnedmore"
        SUFeedURL: https://github.com/arhxam/whoburnedmore/releases/latest/download/appcast.xml
        SUPublicEDKey: 9kMJHuWCAYyBMx48e30Xh4g7qABppEKiPkQ5rdQE9vo=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whoburnedmore.burnbar
        # Xcode's generated plist otherwise replaces CFBundleName with
        # PRODUCT_NAME (BurnBar), even though the explicit plist says otherwise.
        INFOPLIST_KEY_CFBundleName: whoburnedmore
        INFOPLIST_KEY_CFBundleDisplayName: whoburnedmore
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_HARDENED_RUNTIME: "YES"
        # Keep these aligned with the explicit Info.plist. Sparkle and notarization
        # validate both values at release time.
        MARKETING_VERSION: "0.8.2"
        CURRENT_PROJECT_VERSION: "8002"

  BurnBarCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/BurnBarCoreTests]
    dependencies:
      - target: BurnBarCore

schemes:
  BurnBar:
    build:
      targets:
        BurnBar: all
    run:
      config: Release
  BurnBarCoreTests:
    build:
      targets:
        BurnBarCoreTests: all
    test:
      config: Debug
      targets: [BurnBarCoreTests]
